specVersion: "1.0.0"
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ERC20ApprovalProbe
    network: mainnet
    source:
      # Probe template — replace address with target token or use network-wide template later
      address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
      abi: ERC20
      startBlock: 19000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ApprovalEvent
        - Allowance
        - Account
        - Spender
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
      file: ./src/mapping.ts
